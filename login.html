<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - NovaCart</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           LOGIN PAGE
        ========================= */

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    #ddd6ff,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    #cfc7ff,
                    transparent 35%
                ),
                #f7f7f8;
        }

        .auth-page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;

            padding: 45px 42px;

            background: rgba(255, 255, 255, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.8);

            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.12);

            backdrop-filter: blur(20px);
        }

        .auth-logo {
            text-align: center;

            font-size: 27px;

            font-weight: 800;

            margin-bottom: 32px;
        }

        .auth-logo span {
            color: #6c4cff;
        }

        .auth-title {
            text-align: center;

            margin-bottom: 30px;
        }

        .auth-title h1 {
            font-size: 30px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }

        .auth-title p {
            color: #777;

            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: 1px solid #ddd;

            border-radius: 12px;

            outline: none;

            background: white;

            font-size: 14px;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #6c4cff;

            box-shadow:
                0 0 0 4px rgba(108, 76, 255, 0.08);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            background: transparent;

            color: #777;

            font-size: 18px;
        }

        .show-password:hover {
            color: #6c4cff;
        }

        .login-button {
            width: 100%;

            height: 50px;

            margin-top: 5px;

            border-radius: 12px;

            background: #111;

            color: white;

            font-size: 14px;

            font-weight: 700;

            transition: 0.25s;
        }

        .login-button:hover {
            background: #6c4cff;

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(108, 76, 255, 0.25);
        }

        .login-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .auth-message {
            display: none;

            padding: 12px;

            margin-bottom: 18px;

            border-radius: 10px;

            font-size: 13px;

            text-align: center;
        }

        .auth-message.error {
            display: block;

            background: #fff0f0;

            color: #d32f2f;
        }

        .auth-message.success {
            display: block;

            background: #effff4;

            color: #16803a;
        }

        .auth-footer {
            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #eee;

            color: #777;

            font-size: 13px;
        }

        .auth-footer a {
            color: #6c4cff;

            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 18px;

            font-size: 12px;

            color: #888;
        }

        .back-home:hover {
            color: #6c4cff;
        }

        @media (max-width: 500px) {

            .auth-page {
                padding: 15px;
            }

            .auth-card {
                padding: 32px 22px;

                border-radius: 22px;
            }

            .auth-title h1 {
                font-size: 26px;
            }
        }
    </style>
</head>


<body>

    <main class="auth-page">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                Nova<span>Cart</span>
            </div>


            <!-- Title -->
            <div class="auth-title">

                <h1>Welcome Back</h1>

                <p>
                    Login to continue shopping.
                </p>

            </div>


            <!-- Message -->
            <div
                id="authMessage"
                class="auth-message">
            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="toggleLoginPassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Login -->
                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <!-- Register -->
            <div class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <!-- Home -->
            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
